name: InfGen core verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install matching CPU dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-cluster==1.6.3 torch-scatter==2.1.2 -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
          python -m pip install -r requirements-dev.txt
      - name: Unit checks
        run: |
          python -m pytest -q
          ruff check .
          python -m compileall -q infgen run.py train.py val.py infer.py data_preprocess.py
      - name: Train, resume, and causal rollout contract
        run: python scripts/verify_reproduction.py
