# Canonical UT Austin InfGen profile. Evidence and explicit choices: docs/paper_audit.md.
# YAML merges deliberately retain the schema of configs/ours_long_term.yaml.
time_info: &time_info
  num_historical_steps: 11 # WOMD: 1.1 s at 10 Hz; 0.5 s motion-token intervals.
  num_future_steps: 80
  use_intention: True # Released implementation setting; not specified in the paper.
  token_size: 2048
  predict_motion: True
  predict_state: True
  predict_map: False # Static map remains context; map-token pretraining is separate.
  predict_occ: True # Required occupancy features; paper_objective gates auxiliary losses.
  state_token: # Implementation aliases: enter=ADD, exit=REMOVE, valid=KEEP.
    invalid: 0
    valid: 1
    enter: 2
    exit: 3
  pl2seed_radius: 75.
  grid_range: 150.
  grid_interval: 3.
  angle_interval: 3.
  # The released circular grid has 1961 cells; Table 4 reports 1849. See audit.
  seed_size: 1
  buffer_size: 128
  max_num: 32

Dataset:
  <<: *time_info
  root:
  train_batch_size: 1 # Per GPU: 8 devices gives the paper's global batch of 8.
  val_batch_size: 1
  test_batch_size: 1
  shuffle: True
  num_workers: 1 # Resource choice inherited from the release.
  pin_memory: True
  persistent_workers: True
  train_raw_dir: 'data/waymo_processed/training'
  val_raw_dir: 'data/waymo_processed/validation'
  test_raw_dir: 'data/waymo_processed/validation'
  val_tfrecords_splitted: 'data/waymo_processed/validation_tfrecords_splitted'
  transform: WaymoTargetBuilder
  train_processed_dir:
  val_processed_dir:
  test_processed_dir:
  dataset: 'scalable'

Trainer:
  # Auxiliary heads retained for checkpoint/schema compatibility can be unused.
  strategy: ddp_find_unused_parameters_true
  accelerator: 'gpu'
  devices: 8
  max_epochs: 32 # Released recipe; the paper does not specify training duration.
  save_ckpt_path:
  num_nodes: 1
  mode:
  ckpt_path:
  precision: 32 # Implementation choice; no mixed-precision recipe in the paper.
  accumulate_grad_batches: 1
  overfit_epochs: 6000 # Debug-only inherited setting, not the paper experiment.

Model:
  <<: *time_info
  predictor: 'infgen'
  decoder_type: 'agent_decoder'
  dataset: 'waymo'
  paper_objective: True # Eq. 8: unsmoothed CE and no offset/occupancy/map auxiliaries.
  input_dim: 2
  hidden_dim: 128
  output_dim: 2
  output_head: False
  num_heads: 8
  head_dim: 16
  dropout: 0.1 # Released implementation choice, absent from the paper.
  num_freq_bands: 64
  lr: 0.0005
  warmup_steps: 0 # Released implementation choice.
  total_steps: 32 # Scheduler counts epochs in the released Lightning interface.
  predict_map_token: False
  num_recurrent_steps_val: 300 # 30 s of future simulation, output at 10 Hz.
  val_open_loop: False
  val_close_loop: True
  val_insert: False # Insertion-only diagnostic; dynamic insertion remains enabled.
  n_rollout_close_val: 1 # Smoke/default choice; not enough to claim WOSAC scores.
  decoder:
    <<: *time_info
    num_map_layers: 3
    num_agent_layers: 6
    # Scene generation already uses three seed_layers in the released decoder.
    a2a_radius: 60
    pl2pl_radius: 10
    pl2a_radius: 30
    a2sa_radius: 10
    pl2sa_radius: 10 # Heading; position uses pl2seed_radius=75.
    time_span: 60 # Raw 10 Hz frames; decoder divides by shift=5 => 12 tokens.
  loss_weight:
    token_cls_loss: 1
    pos_cls_loss: 10
    head_cls_loss: 1
    state_cls_loss: 10
    shape_reg_loss: 0.2
    type_cls_loss: 5
    # Temporal class order: invalid/KEEP/REMOVE. Invalid is excluded, not trained.
    state_weight: [0.0, 0.1, 0.9]
    # Spatial class order: BEGIN MOTION/ADD (named invalid/enter upstream).
    seed_state_weight: [0.9, 0.1]
    seed_type_weight: [1.0, 1.0, 1.0] # No type-class weighting is stated.
    # Keep schema compatibility, but Eq. 8 contains none of these extra objectives.
    map_token_loss: 0
    offset_reg_loss: 0
    pos_reg_loss: 0
    head_reg_loss: 0
    agent_occ_loss: 0
    pt_occ_loss: 0
    agent_occ_pos_weight: 100 # Inactive under paper_objective.
    pt_occ_pos_weight: 5 # Inactive under paper_objective.
